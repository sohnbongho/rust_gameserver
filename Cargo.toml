[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# 내부 크레이트
proto = { path = "crates/proto" }
net = { path = "crates/net" }
db = { path = "crates/db" }

# 비동기 런타임 / 네트워크
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
bytes = "1.12"
futures = "0.3"

# protobuf
prost = "0.14"
prost-build = "0.14"

# DB / 캐시 — sqlx 의 macros(query!) 기능은 쓰지 않는다 (빌드 시 DB 접속 필요, docs/PORTING.md 5절)
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "chrono"] }
redis = { version = "1.7", features = ["tokio-comp", "connection-manager"] }

# 로깅 / 설정 / 에러
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
anyhow = "1"
thiserror = "2"

# 비밀번호 해시 (C# PasswordHashHelper 호환) / 난수
sha2 = "0.11"
pbkdf2 = "0.13"
base64 = "0.23"
subtle = "2.6"
getrandom = "0.4"
uuid = { version = "1.26", features = ["v4"] }

# 프로세스 CPU·메모리 (모니터 로그, AdminApi /api/stats)
sysinfo = "0.39"

# AdminApi (2단계)
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# dummy_client 키보드 입력
crossterm = "0.29"

# PBKDF2 10만 회는 debug 빌드에서 로그인 1건에 1초 이상 걸린다 — 해시 크레이트만 dev 에서도 최적화한다
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
