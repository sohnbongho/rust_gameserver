# 설정 예시. `config.toml` 로 복사해서 쓴다 (config.toml 은 gitignore 대상 — 자격증명은 거기에만 둔다).
#
#   cp config.example.toml config.toml
#
# 모든 값은 환경변수로 덮어쓸 수 있다: `APP_` 접두사, 중첩은 `__`.
#   APP_DATABASE__MYSQL_URL=mysql://user:pass@host:3306/gamedb cargo ls
# 파일 경로는 APP_CONFIG 로 바꿀 수 있다 (기본: 현재 디렉토리의 config.toml).

# 모든 바이너리가 공유한다
[database]
# sqlx URL 형식 (C# 연결 문자열 형식이 아님). 비밀번호의 특수문자는 URL 인코딩한다 (! → %21)
mysql_url = "mysql://USER:PASSWORD@127.0.0.1:3306/gamedb"
mysql_max_connections = 32
redis_url = "redis://127.0.0.1:6379"
broadcast_channel = "server:notice"

[login_server]
port = 9000
# GameServer 와 공유하는 Redis 키 계약 — 바꾸면 GameServer 도 같이 바꾼다
auth_token_prefix = "auth:token:"
auth_token_ttl_seconds = 60

[login_server.admin_api]
enabled = true
port = 9010
admins = ["user_00001"]
session_key_ttl_minutes = 60
redis_key_prefix = "admin:session:"
# 둘 다 지정하면 HTTPS, 비워두면 HTTP (PEM 형식)
tls_cert_path = ""
tls_key_path = ""

[dummy_client]
login_server = "127.0.0.1:9000"
game_server = "127.0.0.1:9001"
max_client_count = 10000
# 시드 계정 비밀번호이자 로그인 비밀번호
password = "Test1234!"
# `cargo dc -- --seed` 로 만들 계정 수
seed_account_count = 10000
